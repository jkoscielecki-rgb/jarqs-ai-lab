c2qrMPNvRbEbdXNmfTNmQ3OmQDUvbfDaQCZ9c2ZDs6ZAdSuws3+yM29yM0pB53IzWA=";

// C64 palette
const P={blk:'#000000',wht:'#FFFFFF',red:'#883932',cyn:'#67B6BD',pur:'#8B3F96',
grn:'#55A049',blu:'#40318D',yel:'#BFCE72',org:'#8B5429',brn:'#574200',
lrd:'#B86962',dgr:'#505050',gry:'#787878',lgn:'#94E089',lbl:'#7869C4',lgr:'#9F9F9F'};
const COPPER=[P.blu,P.lbl,P.cyn,P.lgn,P.grn,P.yel,P.org,P.lrd,P.red,P.pur];

const CV=document.getElementById('c');
const ctx=CV.getContext('2d');
let frame=0,scrollX=640;
const SCROLL_TEXT='*** JARQS AI LAB ***   HUMAN-LED. AI-ASSISTED. PROCESS-FIRST.   ***   OBSERVE * DESIGN * BUILD * AUDIT * MONITOR * ITERATE   ***   SMALL TOOLS OVER MONOLITHS   *   MONITORING FROM DAY ONE   *   HUMAN CONTROL OVER AUTOMATION   *   PRIVATE BY DEFAULT   ***   BUILT BY JARQS   *   IT ALL BEGAN WITH THE C64 * 1991 – 2026   ***   AND THE LOOP CONTINUES…          ';
const CW=16,CSPD=2;
const MODULES=['HAREM','KLAUDIA','SZYNKA','AGNES','MEDEA','PENNY'];

// Starfield
const stars=Array.from({length:180},()=>({
  x:Math.random()*640, y:38+Math.random()*295,
  s:0.3+Math.random()*1.8, b:0.2+Math.random()*0.8
}));

// Intro
let iPhase=0,iText='',iCursor=0,iTimer=0;
const ITITLE='JARQS AI LAB';

function drawStars(){
  for(const st of stars){
    st.x-=st.s;
    if(st.x<0){st.x=640;st.y=38+Math.random()*295;}
    const a=st.b*(0.7+0.3*Math.sin(frame/20+st.x/80));
    ctx.globalAlpha=a;
    const sz=st.s>1.2?2:1;
    ctx.fillStyle=P.wht;
    ctx.fillRect(Math.round(st.x),Math.round(st.y),sz,sz);
  }
  ctx.globalAlpha=1;
}

function drawCopper(){
  for(let i=0;i<10;i++){
    const y=38+((frame*1.2+i*33)%295);
    const ci=(i+Math.floor(frame/25))%COPPER.length;
    ctx.globalAlpha=0.22;
    ctx.fillStyle=COPPER[ci];
    ctx.fillRect(0,y,640,9);
    ctx.globalAlpha=0.08;
    ctx.fillStyle=COPPER[(ci+1)%COPPER.length];
    ctx.fillRect(0,y+9,640,5);
  }
  ctx.globalAlpha=1;
}

function drawStatusBar(){
  for(let i=0;i<38;i++){
    const ph=(frame*4+i*18)%360;
    const ci=Math.floor(((Math.sin(ph*Math.PI/180)+1)/2)*(COPPER.length-1));
    ctx.fillStyle=COPPER[ci];
    ctx.globalAlpha=0.7;
    ctx.fillRect(0,i,640,1);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(0,0,640,38);
  ctx.fillStyle=P.wht;
  ctx.font='bold 13px monospace';
  ctx.textAlign='left';
  ctx.fillText('>> LAB TELEMETRY: ONLINE',10,24);
  ctx.textAlign='right';
  const t=Math.floor(frame/60);
  const ts=String(t%60).padStart(2,'0');
  const tm=String(Math.floor(t/60)).padStart(2,'0');
  ctx.fillText('UPTIME '+tm+':'+ts,630,24);
}

function drawRobot(cx,cy,bodyCol,eyeCol,accentCol,modIdx){
  const p=3, lx=cx-5*p;
  const mtext=MODULES[modIdx%MODULES.length];

  // Monitor frame
  ctx.fillStyle=P.dgr;
  ctx.fillRect(lx+p,cy-20*p,8*p,7*p);
  ctx.fillStyle='#222';
  ctx.fillRect(lx+2*p,cy-19*p,6*p,5*p);
  // Screen flicker
  if(Math.floor(frame/30)%2===0||Math.random()>0.98){
    ctx.fillStyle=eyeCol;
    ctx.font='bold '+(p*2)+'px monospace';
    ctx.textAlign='center';
    ctx.fillText(mtext.length>6?mtext.slice(0,6):mtext,cx,cy-16*p);
  } else {
    ctx.fillStyle='#001100';
    ctx.fillRect(lx+2*p,cy-19*p,6*p,5*p);
    ctx.fillStyle=eyeCol;
    ctx.globalAlpha=0.3;
    ctx.font='bold '+(p*2)+'px monospace';
    ctx.textAlign='center';
    ctx.fillText(mtext.length>6?mtext.slice(0,6):mtext,cx,cy-16*p);
    ctx.globalAlpha=1;
  }
  // Monitor stand
  ctx.fillStyle=P.dgr;
  ctx.fillRect(cx-p,cy-13*p,2*p,3*p);

  // Desk
  ctx.fillStyle=P.brn;
  ctx.fillRect(lx-2*p,cy-2*p,14*p,3*p);
  ctx.fillStyle='#3a2800';
  ctx.fillRect(lx-2*p,cy-2*p,14*p,1);

  // Keyboard
  ctx.fillStyle=P.lgr;
  ctx.fillRect(lx,cy-4*p,10*p,2*p);
  ctx.fillStyle=P.dgr;
  for(let k=0;k<4;k++) ctx.fillRect(lx+k*2*p+2,cy-4*p+2,p,4);

  // Body
  ctx.fillStyle=bodyCol;
  ctx.fillRect(lx+p,cy-11*p,8*p,6*p);
  // Chest panel
  ctx.fillStyle='#111';
  ctx.fillRect(lx+3*p,cy-10*p,4*p,3*p);
  // LEDs
  ctx.fillStyle=eyeCol; ctx.fillRect(lx+3*p,cy-10*p,p,p);
  ctx.fillStyle=accentCol; ctx.fillRect(lx+4*p+2,cy-10*p,p,p);
  ctx.fillStyle=Math.floor(frame/12)%2?P.red:'#330000';
  ctx.fillRect(lx+3*p,cy-9*p,p,p);
  // Waist
  ctx.fillStyle=bodyCol;
  ctx.fillRect(lx+2*p,cy-5*p,6*p,2*p);

  // Arms
  ctx.fillStyle=bodyCol;
  ctx.fillRect(lx-p,cy-10*p,2*p,5*p);
  ctx.fillRect(lx+9*p,cy-10*p,2*p,5*p);
  // Typing animation
  const tp=Math.sin(frame/7+cx*0.05)>0?2:0;
  ctx.fillStyle=accentCol;
  ctx.fillRect(lx-p,cy-5*p+tp,2*p,p);
  ctx.fillRect(lx+9*p,cy-5*p-tp,2*p,p);

  // Neck
  ctx.fillStyle=bodyCol;
  ctx.fillRect(cx-p,cy-12*p,2*p,2*p);

  // Head
  ctx.fillStyle=bodyCol;
  ctx.fillRect(lx+p,cy-18*p,8*p,6*p);
  ctx.fillRect(lx,cy-17*p,p,4*p);
  ctx.fillRect(lx+9*p,cy-17*p,p,4*p);

  // Eye glow
  ctx.globalAlpha=0.25;
  ctx.fillStyle=eyeCol;
  ctx.fillRect(lx+2*p-2,cy-16*p-2,p+4,p+4);
  ctx.fillRect(lx+6*p-2,cy-16*p-2,p+4,p+4);
  ctx.globalAlpha=1;
  // Eyes
  ctx.fillStyle=eyeCol;
  ctx.fillRect(lx+2*p,cy-16*p,p,p);
  ctx.fillRect(lx+6*p,cy-16*p,p,p);

  // Mouth
  const mo=Math.floor(frame/10)%3;
  ctx.fillStyle='#000';
  ctx.fillRect(lx+3*p,cy-14*p,4*p,p);
  if(mo>0){ctx.fillStyle=accentCol;ctx.fillRect(lx+3*p+mo,cy-14*p,p,p);}

  // Antenna
  ctx.fillStyle=bodyCol;
  ctx.fillRect(cx-1,cy-21*p,2,3*p);
  const ag=Math.floor(frame/18)%2;
  if(ag){
    ctx.globalAlpha=0.4;ctx.fillStyle=accentCol;
    ctx.fillRect(cx-p-1,cy-22*p-1,2*p+2,2*p+2);
    ctx.globalAlpha=1;
  }
  ctx.fillStyle=ag?accentCol:'#333';
  ctx.fillRect(cx-p,cy-22*p,2*p,2*p);
}

function drawScroller(){
  ctx.fillStyle=P.blk;
  ctx.fillRect(0,342,640,58);
  ctx.fillStyle=P.cyn;
  ctx.fillRect(0,342,640,2);
  ctx.fillRect(0,397,640,3);

  ctx.save();
  ctx.rect(0,344,640,53);
  ctx.clip();
  ctx.font='bold 22px monospace';
  const chars=SCROLL_TEXT.split('');
  for(let i=0;i<chars.length;i++){
    const cx2=scrollX+i*CW;
    if(cx2<-CW||cx2>660)continue;
    const sy=Math.sin((cx2/55+frame/12)*Math.PI)*9;
    const hue=(cx2/4+frame)%360;
    // Cycle through C64-ish warm colors
    const ci=Math.floor(((cx2/80+frame/40)%COPPER.length+COPPER.length)%COPPER.length);
    ctx.fillStyle=COPPER[Math.abs(ci)%COPPER.length];
    ctx.fillText(chars[i],cx2,370+sy);
  }
  ctx.restore();

  scrollX-=CSPD;
  if(scrollX<-(SCROLL_TEXT.length*CW))scrollX=641;
}

function drawScanlines(){
  ctx.globalAlpha=0.07;
  ctx.fillStyle='#000';
  for(let y=0;y<400;y+=2) ctx.fillRect(0,y,640,1);
  ctx.globalAlpha=1;
}

function drawIntro(){
  ctx.fillStyle=P.blk;
  ctx.fillRect(0,0,640,400);
  ctx.fillStyle=P.cyn;
  ctx.font='bold 36px monospace';
  ctx.textAlign='center';
  const cur=Math.floor(frame/15)%2?'_':' ';
  ctx.fillText(iText+(iPhase<2?cur:''),320,180);

  if(iPhase===0){
    iTimer++;
    if(iTimer%5===0&&iCursor<ITITLE.length) iText+=ITITLE[iCursor++];
    if(iCursor>=ITITLE.length){iTimer=0;iPhase=1;}
  } else if(iPhase===1){
    iTimer++;
    ctx.fillStyle=P.lgr;
    ctx.font='14px monospace';
    const dots='.'.repeat((Math.floor(iTimer/15)%3)+1);
    ctx.fillText('LOADING'+dots,320,215);
    if(iTimer>100) iPhase=2;
  } else if(iPhase===2){
    iTimer++;
    ctx.globalAlpha=Math.max(0,1-(iTimer/40));
    ctx.fillStyle=P.blk;
    ctx.fillRect(0,0,640,400);
    ctx.globalAlpha=1;
    if(iTimer>40) iPhase=3;
  }
  return iPhase<3;
}

function render(){
  frame++;
  if(iPhase<3){
    if(drawIntro()){requestAnimationFrame(render);return;}
  }

  const mIdx=Math.floor(frame/120)%MODULES.length;

  ctx.fillStyle=P.blk;
  ctx.fillRect(0,0,640,400);

  drawStars();
  drawCopper();

  // Floor line
  ctx.fillStyle='#222';
  ctx.fillRect(0,335,640,2);
  ctx.fillStyle='#111';
  ctx.fillRect(0,337,640,5);

  // Robots
  ctx.textAlign='center';
  drawRobot(140,310,P.cyn,P.lgn,P.yel,mIdx);
  drawRobot(320,295,P.yel,P.cyn,P.lrd,(mIdx+2)%MODULES.length);
  drawRobot(500,305,P.lbl,P.yel,P.cyn,(mIdx+4)%MODULES.length);

  drawStatusBar();
  drawScroller();
  drawScanlines();

  requestAnimationFrame(render);
}

function startDemo(){
  const el=document.getElementById('overlay');
  if(el) el.remove();
  // Init SID audio
  try{
    const raw=atob(SID_B64);
    const arr=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
    const blob=new Blob([arr],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    playSID(url,0);
  }catch(e){console.warn('Audio init failed:',e);}
  requestAnimationFrame(render);
}

document.getElementById('overlay').addEventListener('click',startDemo,{once:true});
